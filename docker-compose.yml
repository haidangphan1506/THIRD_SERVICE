# Docker Compose v2 and Podman Compose (`podman compose up -d`) use this file.
# Host port defaults to 5432 (override with POSTGRES_PORT in .env).
# `backend-net` is a fixed-name network so other external stacks (e.g. Uptime Kuma) can
# join it via `networks: { backend-net: { external: true } }` and reach these containers
# by container name (backends-postgres / backends-redis) instead of `localhost`.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: backends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backends_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backends_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: backends-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    name: backend-net
